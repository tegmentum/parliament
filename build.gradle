ext {
	parliamentVersion = '3.0.0'
	githubOrg = 'raytheonbbn'

	targetDir = file("${rootDir}/target")
	deployableDir = file("${targetDir}/deployableServer")
	depDir = file("${rootDir}/dependencies")
	depDataDir = file("${depDir}/data")
}

allprojects {
	group = 'com.bbn.parliament'
	version = "${rootProject.ext.parliamentVersion}-SNAPSHOT"

	tasks.withType(JavaCompile).all {
		options.compilerArgs.add('-Xlint:all')
		options.encoding = 'UTF-8'
	}
}

subprojects {
	repositories {
		maven {
			url = uri('https://repo.osgeo.org/repository/release/')
		}
		mavenCentral()
		// Vendored copy of ai.tegmentum.jena:webfunction (built from
		// ~/git/jena-webfunction-plugin, refreshed into vendor-m2 by hand).
		// Once the plugin ships to a public repo this can go away.
		maven { url = uri("${rootDir}/vendor-m2") }
		// Local Maven cache — used during host builds; empty in Docker.
		mavenLocal()
	}
}
